<div id="orderModal" class="modal-container">
  <div class="modal-box">
    <button class="modal-close" type="button" aria-label="Close modal">
      <svg class="modal-close-icon" width="24" height="24">
        <use href="/img/sprite.svg#icon-close"></use>
      </svg>
    </button>
    <h2 class="modal-title">Оформлення замовлення</h2>
    <form class="modal-form">
      <label class="modal-label" for="name">
        <span class="modal-label-text">Ім'я*</span>

        <input
          class="modal-input"
          name="username"
          id="name"
          type="text"
          placeholder="Вікторія"
          minlength="2"
          maxlength="48"
          required
      /></label>

      <label class="modal-label" for="phone">
        <span class="modal-label-text">Телефон*</span>

        <input
          class="modal-input"
          id="phone"
          name="phone"
          type="tel"
          placeholder="38 0_ ___"
          pattern="^[0-9]{12}$"
          minlength="12"
          maxlength="12"
          required
        />
      </label>
      <label class="modal-label" for="comment">
        <span class="modal-label-text">Коментар*</span>

        <textarea
          class="modal-textarea"
          id="comment"
          name="textComment"
          placeholder="Ваш коментар"
          minlength="2"
          maxlength="256"
          required
        ></textarea>
      </label>
      <button class="modal-submit" type="submit">Надіслати заявку</button>
    </form>
  </div>
</div>
